
workflows:
  android-debug:
    name: Android Debug APK

    environment:
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Install Android Build Tools 35
        script: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Modern Android SDK Manager not found."
            exit 1
          fi

          rm -rf "$SDK_ROOT/build-tools/35.0.0"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Build Debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

